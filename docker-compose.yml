services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: projeto-korp-api
    restart: always
    expose:
      - "8080"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: projeto-korp-nginx
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: projeto-korp-prometheus
    restart: always
    volumes:
      # Injeta a configuração que acabamos de criar
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: projeto-korp-grafana
    restart: always
    ports:
      - "3030:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus